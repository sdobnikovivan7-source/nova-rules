name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # seed не хранится в git; тест поиска работает на нём
      - name: Seed из фикстур
        run: pnpm scrape --offline --out .cache/data && pnpm seed --from .cache/data
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
