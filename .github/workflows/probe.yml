name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="NovaRulesBot/1.0 (+https://github.com/sdobnikovivan7-source/nova-rules)"
          for u in https://forum.grand-rp.su/forums/893/ https://forum.grand-rp.su/threads/403002/; do
            echo "=== $u"
            curl -sS -A "$UA" -D - -o body.html "$u" | head -30
            wc -c body.html; grep -o '<title>[^<]*' body.html; grep -c structItem--thread body.html
            head -c 1500 body.html; echo
          done
          curl -sS https://ipinfo.io/json | head -10
