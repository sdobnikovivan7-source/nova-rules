# Выпуск приложения (§11.3): тег v* → установщик в GitHub Releases.
#
#   1. поднять "version" в package.json, закоммитить;
#   2. git tag v1.0.0 && git push origin v1.0.0.
#
# В установщик кладётся свежий снимок правил из ветки data (seed для первого запуска).
# Пока ветки data нет (форум закрыт проверкой браузера) — снимок из фикстур в репозитории.
# В Releases появляется черновик с NOVA-Rules-Setup-x.y.z.exe, .blockmap, latest.yml
# и копией NOVA-Rules-Setup.exe (для прямой ссылки на скачивание):
# проверить установщик на VirusTotal, добавить ссылку в описание и опубликовать —
# автообновление видит только опубликованные релизы.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Версия тега = версия в package.json
        shell: bash
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          [ "$pkg" = "$GITHUB_REF_NAME" ] || { echo "::error::Тег $GITHUB_REF_NAME, а в package.json $pkg"; exit 1; }

      - name: Снимок данных из ветки data
        uses: actions/checkout@v4
        with:
          ref: data
          path: prev
        continue-on-error: true # ветки может ещё не быть

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Seed
        shell: bash
        run: |
          if [ -f prev/data/manifest.json ]; then
            pnpm seed --from prev/data
          else
            echo "::warning::Ветки data нет — seed из фикстур"
            pnpm scrape --offline --out .cache/data
            pnpm seed --from .cache/data
          fi

      - run: pnpm typecheck
      - run: pnpm test

      # черновик заранее: иначе electron-builder грузит файлы параллельно и создаёт два черновика
      - name: Черновик релиза
        shell: bash
        run: gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --draft --title "${GITHUB_REF_NAME#v}" --notes ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Сборка и публикация
        run: pnpm build && pnpm exec electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # копия без версии в имени — постоянная ссылка releases/latest/download/NOVA-Rules-Setup.exe
      - name: Установщик под постоянным именем
        shell: bash
        run: |
          cp "dist/NOVA-Rules-Setup-${GITHUB_REF_NAME#v}.exe" dist/NOVA-Rules-Setup.exe
          gh release upload "$GITHUB_REF_NAME" dist/NOVA-Rules-Setup.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Установщик в артефакты job
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error
